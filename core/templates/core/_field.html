<div class="field{% if extra_class %} {{ extra_class }}{% endif %}{% if field.errors %} has-error{% endif %}" data-field="{{ field.name }}">
  <label for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  <div class="field-error" data-error-for="{{ field.name }}">{% for e in field.errors %}{{ e }} {% endfor %}</div>
</div>
